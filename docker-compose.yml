services:
  # ===========================================================================
  # Serviço: Robô de Automação (RPA LMS - LG Electronics)
  # ===========================================================================
  rpa:
    build:
      context: ./ideal_raw_RPA
      dockerfile: Dockerfile
    container_name: lms_rpa
    # Fora do "docker compose up" padrão: exige credenciais LGE e roda sob demanda.
    # Use "docker compose run --rm rpa ..." ou "docker compose --profile rpa up".
    profiles: ["rpa"]
    stdin_open: true
    tty: true
    # Alocação de memória compartilhada adequada para o Chromium evitar falhas de renderização
    shm_size: '1gb'
    ipc: host
    env_file:
      - path: .env
        required: false
      - path: ./ideal_raw_RPA/.env
        required: false
    environment:
      - HEADLESS=true
      - PYTHONUNBUFFERED=1
      # O robô registra a execução e grava os contratos na API do monitor
      - API_URL=http://api:8000/api
      - RPA_API_TOKEN=${RPA_API_TOKEN:-}
    volumes:
      # Planilhas baixadas e consolidadas ficam disponíveis no host
      - ./ideal_raw_RPA/downloads:/app/downloads
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lms_network
    # Fluxo completo: login, relatório, extração detalhada e envio para a base.
    # Pode ser sobrescrito para executar 'python login.py' ou 'python obter_otp.py'.
    command: ["python", "main.py"]

  # ===========================================================================
  # Serviço: Banco de Dados (PostgreSQL)
  # ===========================================================================
  db:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_legal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: America/Manaus
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lms_network

  # ===========================================================================
  # Serviço: Backend API (FastAPI)
  # ===========================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_backend_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lms_legal}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8080}
      # "real": só o robô grava execuções e contratos. "simulated": dados fictícios para demonstração.
      RPA_MODE: ${RPA_MODE:-simulated}
      # Token que o robô envia em X-RPA-Token. Vazio desativa as rotas /api/rpa/.
      RPA_API_TOKEN: ${RPA_API_TOKEN:-}
      # Simulador do RPA (usado só no modo "simulated")
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      SEED_DAYS: ${SEED_DAYS:-30}
      SIMULATOR_FAILURE_RATE: ${SIMULATOR_FAILURE_RATE:-0.12}
      SIMULATOR_SPEED: ${SIMULATOR_SPEED:-1.0}
      SIMULATOR_SCHEDULER_ENABLED: ${SIMULATOR_SCHEDULER_ENABLED:-true}
      SIMULATOR_SCHEDULE: ${SIMULATOR_SCHEDULE:-08:00,12:00,18:00}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms_network

  # ===========================================================================
  # Serviço: Frontend Web (Angular servido pelo Nginx, com proxy de /api)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms_frontend_web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lms_network

# =============================================================================
# Redes compartilhadas entre os serviços
# =============================================================================
networks:
  lms_network:
    name: lms_network
    driver: bridge

# =============================================================================
# Volumes persistentes (para bancos de dados ou logs)
# =============================================================================
volumes:
  postgres_data:
    driver: local
