services:
  # ===========================================================================
  # Serviço: Robô de Automação (RPA LMS - LG Electronics)
  # ===========================================================================
  rpa:
    build:
      context: ./ideal_raw_RPA
      dockerfile: Dockerfile
    container_name: lms_rpa
    stdin_open: true
    tty: true
    # Alocação de memória compartilhada adequada para o Chromium evitar falhas de renderização
    shm_size: '1gb'
    ipc: host
    env_file:
      - path: .env
        required: false
      - path: ./ideal_raw_RPA/.env
        required: false
    environment:
      - HEADLESS=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ideal_raw_RPA/downloads:/app/downloads
    networks:
      - lms_network
    # Fluxo completo; pode ser sobrescrito para executar 'python login.py' ou 'python obter_otp.py'.
    command: ["python", "main.py"]

  # ===========================================================================
