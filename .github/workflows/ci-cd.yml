name: CI/CD Pipeline - LMS Legal RPA

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Permissões necessárias para publicar pacotes no GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # 1. CI: Robô (ideal_raw_RPA) — black, flake8 e pytest
  # ===========================================================================
  rpa-tests:
    name: RPA · black + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ideal_raw_RPA
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ideal_raw_RPA/requirements*.txt'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt flake8

      - name: Formatação (black)
        run: black --check --diff .

      - name: Erros críticos (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Testes unitários e de integração (pytest)
        run: pytest -v

  # ===========================================================================
  # 2. CI: API (backend) — black e pytest (inclui o fluxo do robô contra a API)
  # ===========================================================================
  api-tests:
    name: API · black + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Formatação (black)
        run: black --check --diff .

      - name: Testes unitários e de integração (pytest)
        run: pytest -v

  # ===========================================================================
  # 3. CI: Front-end (Angular) — tipos, Jest e build de produção
  # ===========================================================================
  frontend-tests:
    name: Front · Jest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Checagem de tipos dos testes
        run: npm run typecheck:test

      - name: Testes unitários e de integração (Jest + Babel)
        run: npx jest --ci

      - name: Build de produção
        run: npx ng build --configuration production

  # ===========================================================================
  # 4. CI/CD: Validação, Build do Docker e Publicação no GHCR
  # ===========================================================================
  docker-pipeline:
    name: Docker Build, Test & Registry Push
    needs: [rpa-tests, api-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar Sintaxe do Docker Compose
        run: |
          echo "Validando estrutura do arquivo docker-compose.yml..."
          docker compose config
          echo "✅ Configuração do Docker Compose válida!"

      - name: Definir nome da imagem em minúsculas para GHCR
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/rpa" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados e Tags para a Imagem Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Construir Imagem Docker local para Teste (com cache GHA)
        uses: docker/build-push-action@v6
        with:
          context: ./ideal_raw_RPA
          file: ./ideal_raw_RPA/Dockerfile
          load: true
          tags: lms_rpa:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Executar Smoke Test no Contêiner
        run: |
          echo "Testando inicialização do ambiente e bibliotecas nativas dentro do contêiner..."
          docker run --rm lms_rpa:test python -c "
          import playwright
          import ddddocr
          import cv2
          import PIL
          import onnxruntime
          import pandas
          import openpyxl
          import requests
          import src.pipeline
          print('✅ Sucesso: dependências nativas e o fluxo do robô carregaram corretamente no contêiner!')
          "

      - name: Publicar Imagem no GHCR (Continuous Delivery)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./ideal_raw_RPA
          file: ./ideal_raw_RPA/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
