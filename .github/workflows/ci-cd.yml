name: CI/CD Pipeline - LMS Legal RPA

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Permissões necessárias para publicar pacotes no GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # 1. CI: Qualidade de Código e Checagem de Sintaxe Python
  # ===========================================================================
  code-quality:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ideal_raw_RPA/requirements.txt'

      - name: Validar Sintaxe dos Arquivos Python (.py)
        run: |
          echo "Compilando arquivos Python para verificar integridade sintática..."
          python -m py_compile $(find ideal_raw_RPA -name "*.py")
          echo "✅ Todos os arquivos Python compilaram sem erros de sintaxe!"

      - name: Instalar Ferramentas de Lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Executar Análise Estática com Flake8
        run: |
          echo "Checando erros críticos de sintaxe e nomes indefinidos..."
          flake8 ideal_raw_RPA --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "Checando conformidade de estilo (não bloqueante)..."
          flake8 ideal_raw_RPA --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  # ===========================================================================
  # 2. CI/CD: Validação, Build do Docker e Publicação no GHCR
  # ===========================================================================
  docker-pipeline:
    name: Docker Build, Test & Registry Push
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar Sintaxe do Docker Compose
        run: |
          echo "Validando estrutura do arquivo docker-compose.yml..."
          docker compose config
          echo "✅ Configuração do Docker Compose válida!"

      - name: Definir nome da imagem em minúsculas para GHCR
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/rpa" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados e Tags para a Imagem Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Construir Imagem Docker local para Teste (com cache GHA)
        uses: docker/build-push-action@v6
        with:
          context: ./ideal_raw_RPA
          file: ./ideal_raw_RPA/Dockerfile
          load: true
          tags: lms_rpa:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Executar Smoke Test no Contêiner
        run: |
          echo "Testando inicialização do ambiente e bibliotecas nativas dentro do contêiner..."
          docker run --rm lms_rpa:test python -c "
          import playwright
          import ddddocr
          import cv2
          import PIL
          import onnxruntime
          print('✅ Sucesso: Todas as dependências (Playwright, OpenCV, ONNX, OCR) foram carregadas corretamente no contêiner!')
          "

      - name: Publicar Imagem no GHCR (Continuous Delivery)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./ideal_raw_RPA
          file: ./ideal_raw_RPA/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
