<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>LMS RPA Monitor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ?v=N força o navegador a buscar o ícone de novo: incremente ao trocar o favicon -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/android-chrome-192x192.png?v=2">
  <script>
    // Aplica o tema salvo antes da primeira pintura, evitando "piscar" o tema errado.
    try {
      if (localStorage.getItem('lms-rpa-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
