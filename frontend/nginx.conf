server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para a API FastAPI (serviço "api" na rede lms_network).
    # Mesma origem para o navegador, então o CORS não entra em jogo em produção.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canal WebSocket (logs em tempo real) — reservado para a próxima etapa
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Arquivos de src/assets mantêm o nome original (favicon, imagens): sempre revalidar,
    # senão uma troca de arquivo não chega ao navegador.
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Só o que o build gera com hash no nome (JS, CSS e fontes em /media) pode ficar em cache longo
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback do roteamento do Angular (ex.: /execucoes/1042)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
